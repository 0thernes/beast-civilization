[workspace]
resolver = "2"
members = [
    "crates/beast-wire",
    "crates/beast-root",
    "crates/beast-c2c",
    "crates/beast-colony",
    "crates/beast-cuda",
    "crates/beast-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["Alexander Stephen Donahue <0_0@0thernes.art>"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
