project:
  name: "BEAST CIVILIZATION Formal Verification Suite (BeastProofs v1.0.0)"
  description: >-
    Zero-Mathlib Lean 4.35.0 formalization of 81 audited theorems (65 core domain
    theorems B01-B65 across 7 modules, 8 concrete non-vacuity witnesses NV01-NV08, and
    8 adversarial false-variant refutations AT01-AT08) certifying BitNet b1.58 5-trit/byte
    bijection, GGUF v3 Q4_0 compression, MIT Cache-to-Cache Augment-over-Overwrite laws,
    Ring-0 immutability, spend-cap conservation, OS secret scrubbing & HTTP SSRF guard,
    NonHuman monotonicity, ReZero & WSE spectral contraction, Planaria GF(2^8) & Merkle
    invariants, FIPS-203 ML-KEM-768 / FIPS-197 AES-256 dimensions, QGT PSD bound,
    Eshkol DualInt Leibniz commutativity, Church-Rosser XOR confluence, Multiboot1/2
    checksums, Blackwell PTX grid coverage, and live hardware receipt consistency.
  authors:
    - "Alexander Stephen Donahue (ORCID 0009-0006-8168-9648, Independent Researcher, Spokane, WA, USA)"
  responsible_maintainers:
    - "Alexander Stephen Donahue <0_0@0thernes.art> (GitHub: @0thernes, ORCID 0009-0006-8168-9648)"
  license: "Apache-2.0"

