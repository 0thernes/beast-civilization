fidelity:
  divergences: >-
    Lean 4.35.0 verifies discrete algebraic, encoding, bitvector, isolation, and exported
    receipt-consistency abstractions over Spec.lean, whereas native Rust/Zig/C11/PTX/CRuby
    code executes floating-point training/attention/AD, OS kernel Job Objects, QEMU boot,
    and GPU kernels outside the Lean kernel. See docs/statement-fidelity.md.

