status:
  scope: >-
    Certifies exact integer, bitvector, combinatorial, algebraic, isolation, non-vacuity,
    adversarial-refutation, and exported receipt-consistency invariants over Spec.lean
    strictly within [propext, Classical.choice, Quot.sound] with zero Mathlib, zero sorry
    in Solution, zero native_decide, zero bv_decide, and zero warnings. Explicitly NOT
    formalized inside the Lean 4 kernel: Rust/Zig/C11/PTX memory safety, floating-point
    SGD/softmax/AD rounding, live hardware timings, OS kernel Job Object enforcement, or
    upstream physics library internals. Zero (0/1,900) overarching open problems in
    0thernes/unsolved-problems-mega-atlas (v2.8.0) are claimed solved or retired.
  sorry_count: 0
  sorry_in_definitions: 0
