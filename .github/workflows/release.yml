# SPDX-License-Identifier: Apache-2.0
# Automated Release Checksum & SLSA v4 Build-Provenance Workflow (A11, B37, B38)
name: Release Artifacts & Provenance

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release artifact checksums & generate SHA256SUMS
        run: |
          sha256sum -c CHECKSUMS.sha256
          sha256sum \
            dist/Donahue_2026_beast_civilization.pdf \
            dist/arxiv_submission.tar.gz \
            CHECKSUMS.sha256 \
            data/timestamps/CHECKSUMS.sha256.tsr \
            results/lean4-audit.txt \
            results/citation-audit.json \
            results/paired_stats_n24.txt \
            results/verify_win64.txt > SHA256SUMS
          cat SHA256SUMS
      - name: Attest release build provenance (SLSA v4)
        uses: actions/attest-build-provenance@v4
        continue-on-error: true
        with:
          subject-path: |
            dist/Donahue_2026_beast_civilization.pdf
            dist/arxiv_submission.tar.gz
            CHECKSUMS.sha256
            SHA256SUMS
